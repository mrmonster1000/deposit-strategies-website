<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dashboard Background -->
  <rect width="600" height="400" rx="8" fill="#F8F9FA"/>
  
  <!-- Header -->
  <rect width="600" height="60" fill="#1C0962"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white">Deposit Strategies Dashboard</text>
  
  <!-- Navigation Tabs -->
  <rect x="30" y="80" width="100" height="40" rx="4" fill="#FEE000"/>
  <text x="80" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#1C0962">Overview</text>
  
  <rect x="140" y="80" width="100" height="40" rx="4" fill="#E8E8E8"/>
  <text x="190" y="104" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Analytics</text>
  
  <rect x="250" y="80" width="100" height="40" rx="4" fill="#E8E8E8"/>
  <text x="300" y="104" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Alerts</text>
  
  <!-- Main Content Area -->
  <!-- Rate Summary Cards -->
  <g transform="translate(30, 140)">
    <!-- Card 1 -->
    <rect width="170" height="80" rx="8" fill="white" stroke="#E8E8E8"/>
    <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" fill="#666">Average Market Rate</text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1C0962">4.25%</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="11" fill="#10B981">↑ 0.15% this week</text>
  </g>
  
  <g transform="translate(210, 140)">
    <!-- Card 2 -->
    <rect width="170" height="80" rx="8" fill="white" stroke="#E8E8E8"/>
    <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" fill="#666">Your Position</text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1C0962">3rd</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">of 15 banks</text>
  </g>
  
  <g transform="translate(390, 140)">
    <!-- Card 3 -->
    <rect width="170" height="80" rx="8" fill="white" stroke="#E8E8E8"/>
    <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" fill="#666">Rate Changes Today</text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1C0962">7</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="11" fill="#EF4444">3 competitors moved</text>
  </g>
  
  <!-- Chart Area -->
  <g transform="translate(30, 240)">
    <rect width="540" height="140" rx="8" fill="white" stroke="#E8E8E8"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1C0962">Rate Trends - Last 30 Days</text>
    
    <!-- Simple line chart -->
    <path d="M 40 100 L 100 95 L 160 85 L 220 80 L 280 75 L 340 78 L 400 72 L 460 70 L 520 65" 
          stroke="#FEE000" stroke-width="3" fill="none"/>
    <path d="M 40 110 L 100 108 L 160 105 L 220 100 L 280 98 L 340 95 L 400 93 L 460 90 L 520 88" 
          stroke="#1C0962" stroke-width="3" fill="none"/>
    
    <!-- Legend -->
    <rect x="420" y="40" width="12" height="12" rx="2" fill="#FEE000"/>
    <text x="440" y="50" font-family="Arial, sans-serif" font-size="11" fill="#666">Market Avg</text>
    
    <rect x="420" y="60" width="12" height="12" rx="2" fill="#1C0962"/>
    <text x="440" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">Your Rate</text>
  </g>
</svg>