<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBES.io | Global Banking Ecosystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
        }

        .tagline {
            font-size: 1.1rem;
            color: #888888;
            font-weight: 400;
            margin-bottom: 3rem;
        }

        .description {
            font-size: 1rem;
            color: #666666;
            line-height: 1.7;
            max-width: 400px;
            margin-bottom: 3rem;
        }

        a {
            color: #888888;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        a:hover {
            color: #ffffff;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GBES.io</h1>
        <p class="tagline">Global Banking Ecosystem</p>
        <p class="description">
            Next-gen banking intelligence.<br>
            Treasury. Risk. Compliance. And more.<br>
            One unified ecosystem.
        </p>
        <a href="https://www.neuro-xi.com">Neuro-XI</a>
    </div>
</body>
</html>
